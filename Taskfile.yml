version: "3"

vars:
    APP_NAME: "Dora"
    BIN_DIR: "bin"
    VERSION:
        sh: node version.cjs
    RMRF: '{{if eq OS "windows"}}powershell -NoProfile -NonInteractive Remove-Item -Force -Recurse -ErrorAction SilentlyContinue{{else}}rm -rf{{end}}'
    DATE: '{{if eq OS "windows"}}powershell -NoProfile -NonInteractive Get-Date -UFormat{{else}}date{{end}}'
    ARTIFACTS_BUCKET: doraterm-github-artifacts/staging-w2
    RELEASES_BUCKET: dl.doraterm.dev/releases-w2
    WINGET_PACKAGE: dfbb.Dora

tasks:
    electron:dev:
        desc: Run the Electron application via the Vite dev server (enables hot reloading).
        cmd: npm run dev
        aliases:
            - dev
        deps:
            - npm:install
            - build:backend
        env:
            DORATERM_ENVFILE: "{{.ROOT_DIR}}/.env"
            WCLOUD_PING_ENDPOINT: "https://ping-dev.doraterm.dev/central"
            WCLOUD_ENDPOINT: "https://api-dev.doraterm.dev/central"
            WCLOUD_WS_ENDPOINT: "wss://wsapi-dev.doraterm.dev"
            DORATERM_NOCONFIRMQUIT: "1"

    electron:start:
        desc: Run the Electron application directly.
        cmd: npm run start
        aliases:
            - start
        deps:
            - npm:install
            - build:backend
        env:
            DORATERM_ENVFILE: "{{.ROOT_DIR}}/.env"
            WCLOUD_PING_ENDPOINT: "https://ping-dev.doraterm.dev/central"
            WCLOUD_ENDPOINT: "https://api-dev.doraterm.dev/central"
            WCLOUD_WS_ENDPOINT: "wss://wsapi-dev.doraterm.dev"

    electron:quickdev:
        desc: Run the Electron application via the Vite dev server (quick dev - no docsite, arm64 only, no generate, no dsh).
        cmd: npm run dev
        deps:
            - npm:install
            - build:backend:quickdev
        env:
            DORATERM_ENVFILE: "{{.ROOT_DIR}}/.env"
            WCLOUD_PING_ENDPOINT: "https://ping-dev.doraterm.dev/central"
            WCLOUD_ENDPOINT: "https://api-dev.doraterm.dev/central"
            WCLOUD_WS_ENDPOINT: "wss://wsapi-dev.doraterm.dev/"
            DORATERM_NOCONFIRMQUIT: "1"

    preview:
        desc: Run the standalone component preview server with HMR (no Electron, no backend).
        dir: frontend/preview
        cmd: npx vite
        deps:
            - npm:install

    build:preview:
        desc: Build the component preview server for static deployment.
        dir: frontend/preview
        cmd: npx vite build
        deps:
            - npm:install

    electron:winquickdev:
        desc: Run the Electron application via the Vite dev server (quick dev - Windows amd64 only, no generate, no dsh).
        cmd: npm run dev
        deps:
            - npm:install
            - build:backend:quickdev:windows
        env:
            DORATERM_ENVFILE: "{{.ROOT_DIR}}/.env"
            WCLOUD_PING_ENDPOINT: "https://ping-dev.doraterm.dev/central"
            WCLOUD_ENDPOINT: "https://api-dev.doraterm.dev/central"
            WCLOUD_WS_ENDPOINT: "wss://wsapi-dev.doraterm.dev/"

    package:
        desc: Package the application for the current platform.
        cmds:
            - npm run build:prod && npm exec electron-builder -- -c electron-builder.config.cjs -p never {{.CLI_ARGS}}
        deps:
            - clean
            - npm:install
            - build:backend

    build:frontend:dev:
        desc: Build the frontend in development mode.
        cmd: npm run build:dev
        deps:
            - npm:install

    build:backend:
        desc: Build the dorasrv and wsh components.
        cmds:
            - task: build:server
            - task: build:dsh

    build:backend:quickdev:
        desc: Build only the dorasrv component for quickdev (arm64 macOS only, no generate, no dsh).
        cmds:
            - task: build:server:quickdev
        sources:
            - go.mod
            - go.sum
            - pkg/**/*.go
            - pkg/**/*.sh
            - cmd/**/*.go
            - package.json

    build:schema:
        desc: Build the schema for configuration.
        sources:
            - "cmd/generateschema/*.go"
            - "pkg/dconfig/*.go"
        generates:
            - "dist/schema/**/*"
        cmds:
            - go run cmd/generateschema/main-generateschema.go
            - cmd: '{{.RMRF}} "dist/schema"'
              ignore_error: true
            - task: copyfiles:'schema':'dist/schema'

    build:server:
        desc: Build the dorasrv component.
        cmds:
            - task: build:server:linux
            - task: build:server:macos
            - task: build:server:windows
        deps:
            - go:mod:tidy
            - generate
        sources:
            - "cmd/server/*.go"
            - "pkg/**/*.go"
            - "pkg/**/*.json"
            - "pkg/**/*.sh"
            - package.json
        generates:
            - dist/bin/dorasrv.*

    build:server:macos:
        desc: Build the dorasrv component for macOS (Darwin) platforms (generates artifacts for both arm64 and amd64).
        platforms: [darwin]
        cmds:
            - cmd: rm -f dist/bin/dorasrv*
              ignore_error: true
            - task: build:server:internal
              vars:
                  ARCHS: arm64,amd64

    build:server:quickdev:
        desc: Build the dorasrv component for quickdev (arm64 macOS only, no generate).
        platforms: [darwin]
        cmds:
            - task: build:server:internal
              vars:
                  ARCHS: arm64
        deps:
            - go:mod:tidy
        sources:
            - "cmd/server/*.go"
            - "pkg/**/*.go"
            - "pkg/**/*.json"
            - "pkg/**/*.sh"
            - "tsunami/**/*.go"
        generates:
            - dist/bin/dorasrv.*

    build:backend:quickdev:windows:
        desc: Build only the dorasrv component for quickdev (Windows amd64 only, no generate, no dsh).
        platforms: [windows]
        cmds:
            - task: build:server:internal
              vars:
                  ARCHS: amd64
                  GO_ENV_VARS: CC="zig cc -target x86_64-windows-gnu"
        deps:
            - go:mod:tidy
        sources:
            - "cmd/server/*.go"
            - "pkg/**/*.go"
            - "pkg/**/*.json"
            - "pkg/**/*.sh"
            - "tsunami/**/*.go"
        generates:
            - dist/bin/dorasrv.x64.exe

    build:server:windows:
        desc: Build the dorasrv component for Windows platforms (only generates artifacts for the current architecture).
        platforms: [windows]
        cmds:
            - cmd: powershell -NoProfile -NonInteractive -Command "Remove-Item -Force -ErrorAction SilentlyContinue -Path dist/bin/dorasrv*"
              ignore_error: true
            - task: build:server:internal
              vars:
                  ARCHS:
                      sh: echo {{if eq "arm" ARCH}}arm64{{else}}{{ARCH}}{{end}}
                  GO_ENV_VARS:
                      sh: echo "{{if eq "amd64" ARCH}}CC=\"zig cc -target x86_64-windows-gnu\"{{else}}CC=\"zig cc -target aarch64-windows-gnu\"{{end}}"

    build:server:linux:
        desc: Build the dorasrv component for Linux platforms (only generates artifacts for the current architecture).
        platforms: [linux]
        cmds:
            - cmd: rm -f dist/bin/dorasrv*
              ignore_error: true
            - task: build:server:internal
              vars:
                  ARCHS:
                      sh: echo {{if eq "arm" ARCH}}arm64{{else}}{{ARCH}}{{end}}
                  GO_ENV_VARS:
                      sh: echo "{{if eq "amd64" ARCH}}CC=\"zig cc -target x86_64-linux-gnu.2.28\"{{else}}CC=\"zig cc -target aarch64-linux-gnu.2.28\"{{end}}"

    build:server:internal:
        requires:
            vars:
                - ARCHS
        cmd:
            cmd: CGO_ENABLED=1 GOARCH={{.GOARCH}} {{.GO_ENV_VARS}} go build -tags "osusergo,sqlite_omit_load_extension" -ldflags "{{.GO_LDFLAGS}} -X main.BuildTime=$({{.DATE}} +'%Y%m%d%H%M') -X main.WaveVersion={{.VERSION}}" -o dist/bin/dorasrv.{{if eq .GOARCH "amd64"}}x64{{else}}{{.GOARCH}}{{end}}{{exeExt}} cmd/server/main-server.go
            for:
                var: ARCHS
                split: ","
                as: GOARCH
        internal: true

    build:dsh:
        desc: Build the wsh component for all possible targets.
        cmds:
            - cmd: rm -f dist/bin/dsh*
              platforms: [darwin, linux]
              ignore_error: true
            - cmd: powershell -NoProfile -NonInteractive -Command "Remove-Item -Force -ErrorAction SilentlyContinue -Path dist/bin/dsh*"
              platforms: [windows]
              ignore_error: true
            - task: build:dsh:parallel
        deps:
            - go:mod:tidy
            - generate
        sources:
            - "cmd/dsh/**/*.go"
            - "pkg/**/*.go"
            - package.json
        generates:
            - "dist/bin/dsh*"

    build:dsh:parallel:
        deps:
            - task: build:dsh:internal
              vars:
                  GOOS: darwin
                  GOARCH: arm64
            - task: build:dsh:internal
              vars:
                  GOOS: darwin
                  GOARCH: amd64
            - task: build:dsh:internal
              vars:
                  GOOS: linux
                  GOARCH: arm64
            - task: build:dsh:internal
              vars:
                  GOOS: linux
                  GOARCH: amd64
            - task: build:dsh:internal
              vars:
                  GOOS: linux
                  GOARCH: mips
            - task: build:dsh:internal
              vars:
                  GOOS: linux
                  GOARCH: mips64
            - task: build:dsh:internal
              vars:
                  GOOS: windows
                  GOARCH: amd64
            - task: build:dsh:internal
              vars:
                  GOOS: windows
                  GOARCH: arm64
        internal: true

    build:dsh:internal:
        vars:
            EXT:
                sh: echo {{if eq .GOOS "windows"}}.exe{{end}}
            NORMALIZEDARCH:
                sh: echo {{if eq .GOARCH "amd64"}}x64{{else}}{{.GOARCH}}{{end}}
        requires:
            vars:
                - GOOS
                - GOARCH
                - VERSION
        cmd: (CGO_ENABLED=0 GOOS={{.GOOS}} GOARCH={{.GOARCH}} go build -ldflags="-s -w -X main.BuildTime=$({{.DATE}} +'%Y%m%d%H%M') -X main.WaveVersion={{.VERSION}}" -o dist/bin/dsh-{{.VERSION}}-{{.GOOS}}.{{.NORMALIZEDARCH}}{{.EXT}} cmd/dsh/main-dsh.go)
        internal: true

    generate:
        desc: Generate Typescript bindings for the Go backend.
        cmds:
            - go run cmd/generatets/main-generatets.go
            - go run cmd/generatego/main-generatego.go
        deps:
            - build:schema
        sources:
            - "cmd/generatego/*.go"
            - "cmd/generatets/*.go"
            - "pkg/**/*.go"
        # don't add generates key (otherwise will always execute)

    outdated:
        desc: Check for outdated packages using npm-check-updates.
        cmd: npx npm-check-updates@latest

    version:
        desc: Get the current package version, or bump version if args are present. To pass args to `version.cjs`, add them after `--`. See `version.cjs` for usage definitions for the arguments.
        cmd: node version.cjs {{.CLI_ARGS}}

    artifacts:upload:
        desc: Uploads build artifacts to the staging bucket in S3. To add additional AWS CLI arguments, add them after `--`.
        vars:
            ORIGIN: "make/"
            DESTINATION: "{{.ARTIFACTS_BUCKET}}/{{.VERSION}}"
        cmd: aws s3 cp {{.ORIGIN}}/ s3://{{.DESTINATION}}/ --recursive --exclude "*/*" --exclude "builder-*.yml" {{.CLI_ARGS}}

    artifacts:download:*:
        desc: Downloads the specified artifacts version from the staging bucket. To add additional AWS CLI arguments, add them after `--`.
        vars:
            DL_VERSION: '{{ replace "v" "" (index .MATCH 0)}}'
            ORIGIN: "{{.ARTIFACTS_BUCKET}}/{{.DL_VERSION}}"
            DESTINATION: "artifacts/{{.DL_VERSION}}"
        cmds:
            - '{{.RMRF}} "{{.DESTINATION}}"'
            - aws s3 cp s3://{{.ORIGIN}}/ {{.DESTINATION}}/ --recursive {{.CLI_ARGS}}

    artifacts:publish:*:
        desc: Publishes the specified artifacts version from the staging bucket to the releases bucket. To add additional AWS CLI arguments, add them after `--`.
        vars:
            UP_VERSION: '{{ replace "v" "" (index .MATCH 0)}}'
            ORIGIN: "{{.ARTIFACTS_BUCKET}}/{{.UP_VERSION}}"
            DESTINATION: "{{.RELEASES_BUCKET}}"
        cmd: |
            OUTPUT=$(aws s3 cp s3://{{.ORIGIN}}/ s3://{{.DESTINATION}}/ --recursive {{.CLI_ARGS}})

            for line in $OUTPUT; do
                PREFIX=${line%%{{.DESTINATION}}*}
                SUFFIX=${line:${#PREFIX}}
                if [[ -n "$SUFFIX" ]]; then
                    echo "https://$SUFFIX"
                fi
            done
    artifacts:snap:publish:*:
        desc: Publishes the specified artifacts version to Snapcraft.
        vars:
            UP_VERSION: '{{ replace "v" "" (index .MATCH 0)}}'
            CHANNEL: '{{if contains "beta" .UP_VERSION}}beta{{else}}beta,stable{{end}}'
        cmd: |
            echo "Releasing to channels: [{{.CHANNEL}}]"
            for file in doraterm_{{.UP_VERSION}}_*.snap; do
                echo "Publishing $file"
                snapcraft upload --release={{.CHANNEL}} $file
                echo "Finished publishing $file"
            done

    artifacts:winget:publish:*:
        desc: Submits a version bump request to WinGet for the latest release.
        status:
            - exit {{if contains "beta" .UP_VERSION}}0{{else}}1{{end}}
        vars:
            UP_VERSION: '{{ replace "v" "" (index .MATCH 0)}}'
        cmd: |
            wingetcreate update {{.WINGET_PACKAGE}} -s -v {{.UP_VERSION}} -u "https://{{.RELEASES_BUCKET}}/{{.APP_NAME}}-win32-x64-{{.UP_VERSION}}.msi" -t {{.GITHUB_TOKEN}}

    dev:installdsh:
        desc: quick shortcut to rebuild wsh and install for macos arm64
        requires:
            vars:
                - VERSION
        cmds:
            - task: build:dsh:internal
              vars:
                  GOOS: darwin
                  GOARCH: arm64
            - cp dist/bin/dsh-{{.VERSION}}-darwin.arm64 ~/Library/Application\ Support/doraterm-dev/bin/dsh

    dev:clearconfig:
        desc: Clear the config directory for doraterm-dev
        cmd: "{{.RMRF}} ~/.config/doraterm-dev"

    dev:cleardata:
        desc: Clear the data directory for doraterm-dev
        cmds:
            - task: dev:cleardata:windows
            - task: dev:cleardata:linux
            - task: dev:cleardata:macos

    check:ts:
        desc: Typecheck TypeScript code (frontend and electron).
        cmd: npx tsc --noEmit
        deps:
            - npm:install

    init:
        desc: Initialize the project for development.
        cmds:
            - npm install
            - go mod tidy

    dev:cleardata:windows:
        internal: true
        platforms: [windows]
        cmd: '{{.RMRF}} %LOCALAPPDATA%\doraterm-dev\Data'

    dev:cleardata:linux:
        internal: true
        platforms: [linux]
        cmd: "rm -rf ~/.local/share/doraterm-dev"

    dev:cleardata:macos:
        internal: true
        platforms: [darwin]
        cmd: 'rm -rf ~/Library/Application\ Support/doraterm-dev'

    npm:install:
        desc: Runs `npm install`
        internal: true
        generates:
            - node_modules/**/*
            - package-lock.json
        sources:
            - package-lock.json
            - package.json
        cmd: npm install

    go:mod:tidy:
        desc: Runs `go mod tidy`
        internal: true
        generates:
            - go.sum
        sources:
            - go.mod
        cmd: go mod tidy

    copyfiles:*:*:
        desc: Recursively copy directory and its contents.
        internal: true
        cmd: '{{if eq OS "windows"}}powershell -NoProfile -NonInteractive Copy-Item -Recurse -Force -Path {{index .MATCH 0}} -Destination {{index .MATCH 1}}{{else}}mkdir -p "$(dirname {{index .MATCH 1}})" && cp -r {{index .MATCH 0}} {{index .MATCH 1}}{{end}}'

    clean:
        desc: clean make/dist directories
        cmds:
            - cmd: '{{.RMRF}} "make"'
              ignore_error: true
            - cmd: '{{.RMRF}} "dist"'
              ignore_error: true

    godoc:
        desc: Start the Go documentation server for the root module
        cmd: $(go env GOPATH)/bin/pkgsite -http=:6060

